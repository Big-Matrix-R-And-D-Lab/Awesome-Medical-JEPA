<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for social-preview.png (GitHub social preview + og:image). Re-render the PNG after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10284a"/>
      <stop offset="1" stop-color="#0b5d66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="96" y="156" fill="#5eead4" font-size="22" font-weight="700" letter-spacing="5">AWESOME LIST</text>
    <text x="92" y="250" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="-2">Medical JEPA</text>
    <text x="96" y="318" fill="#cbd5e1" font-size="30">Joint-Embedding Predictive Architectures</text>
    <text x="96" y="358" fill="#cbd5e1" font-size="30">in medicine and healthcare</text>

    <g font-size="19" font-weight="600" fill="#e2e8f0">
      <rect x="96" y="398" width="116" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="154" y="425" text-anchor="middle">Imaging</text>
      <rect x="224" y="398" width="160" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="304" y="425" text-anchor="middle">ECG · EEG</text>
      <rect x="396" y="398" width="112" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="452" y="425" text-anchor="middle">Surgery</text>
      <rect x="520" y="398" width="80" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="560" y="425" text-anchor="middle">EHR</text>
      <rect x="612" y="398" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="664" y="425" text-anchor="middle">Omics</text>
    </g>

    <text x="96" y="540" fill="#94a3b8" font-size="22">github.com/Big-Matrix-R-And-D-Lab/Awesome-Medical-JEPA</text>
  </g>

  <!-- JEPA motif: context + masked patches -> predictor -> latent targets -->
  <g transform="translate(830 150) scale(1.0)">
    <g stroke="#ffffff" stroke-opacity="0.22">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="48" y="0" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="96" y="0" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="144" y="0" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/><rect x="192" y="0" width="40" height="40" rx="8" fill="#14b8a6"/>
      <rect x="0" y="48" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/><rect x="48" y="48" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="96" y="48" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="144" y="48" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="192" y="48" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/>
      <rect x="0" y="96" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="48" y="96" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="96" y="96" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="144" y="96" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/><rect x="192" y="96" width="40" height="40" rx="8" fill="#14b8a6"/>
      <rect x="0" y="144" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/><rect x="48" y="144" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="96" y="144" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="144" y="144" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="192" y="144" width="40" height="40" rx="8" fill="#14b8a6"/>
      <rect x="0" y="192" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="48" y="192" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/><rect x="96" y="192" width="40" height="40" rx="8" fill="#14b8a6"/><rect x="144" y="192" width="40" height="40" rx="8" fill="#f59e0b"/><rect x="192" y="192" width="40" height="40" rx="8" fill="#14b8a6" fill-opacity=".55"/>
    </g>
    <path d="M116 250 V284" stroke="#94a3b8" stroke-width="2.5"/><path d="M109 282 L116 294 L123 282 z" fill="#94a3b8"/>
    <rect x="56" y="300" width="120" height="52" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="116" y="333" text-anchor="middle" fill="#e2e8f0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">predictor</text>
    <path d="M182 326 H226" stroke="#94a3b8" stroke-width="2.5"/><path d="M224 319 L236 326 L224 333 z" fill="#94a3b8"/>
    <g fill="#f59e0b">
      <rect x="248" y="276" width="16" height="76" rx="8"/><rect x="272" y="292" width="16" height="60" rx="8" fill-opacity=".75"/><rect x="296" y="266" width="16" height="86" rx="8" fill-opacity=".9"/><rect x="320" y="304" width="16" height="48" rx="8" fill-opacity=".7"/>
    </g>
