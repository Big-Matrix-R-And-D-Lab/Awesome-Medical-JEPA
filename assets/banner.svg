<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Awesome Medical JEPA</title>
  <desc id="d">A curated list of Joint-Embedding Predictive Architectures in medicine and healthcare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10284a"/>
      <stop offset="1" stop-color="#0b5d66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="100" fill="#5eead4" font-size="18" font-weight="600" letter-spacing="4">AWESOME LIST</text>
    <text x="70" y="168" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1.5">Medical JEPA</text>
    <text x="72" y="214" fill="#cbd5e1" font-size="22">Joint-Embedding Predictive Architectures</text>
    <text x="72" y="244" fill="#cbd5e1" font-size="22">in medicine and healthcare</text>

    <g font-size="14" font-weight="600" fill="#e2e8f0">
      <rect x="72" y="268" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="118" y="287" text-anchor="middle">Imaging</text>
      <rect x="174" y="268" width="88" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="218" y="287" text-anchor="middle">Signals</text>
      <rect x="272" y="268" width="88" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="316" y="287" text-anchor="middle">Surgery</text>
      <rect x="370" y="268" width="60" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="400" y="287" text-anchor="middle">EHR</text>
      <rect x="440" y="268" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="480" y="287" text-anchor="middle">Omics</text>
    </g>
  </g>

  <!-- JEPA motif: context patches -> predictor -> latent targets -->
  <g transform="translate(760 70)">
    <!-- 5x5 patch grid: teal = context, amber = masked target -->
    <g stroke="#ffffff" stroke-opacity="0.22">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="36" y="0" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="72" y="0" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="108" y="0" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="144" y="0" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="0" y="36" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="36" y="36" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="72" y="36" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="108" y="36" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="144" y="36" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="0" y="72" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="36" y="72" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="72" y="72" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="108" y="72" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="144" y="72" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="0" y="108" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="36" y="108" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="72" y="108" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="108" y="108" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="144" y="108" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="0" y="144" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="36" y="144" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
      <rect x="72" y="144" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.85"/>
      <rect x="108" y="144" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="144" y="144" width="30" height="30" rx="6" fill="#14b8a6" fill-opacity="0.55"/>
    </g>

    <path d="M190 87 H250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- predictor -->
    <rect x="258" y="57" width="104" height="60" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="310" y="93" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">predictor</text>

    <path d="M368 87 H420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- latent target embeddings -->
    <g fill="#f59e0b">
      <rect x="430" y="40" width="14" height="94" rx="7" fill-opacity="0.95"/>
      <rect x="452" y="58" width="14" height="76" rx="7" fill-opacity="0.75"/>
      <rect x="474" y="30" width="14" height="104" rx="7" fill-opacity="0.9"/>
      <rect x="496" y="72" width="14" height="62" rx="7" fill-opacity="0.7"/>
    </g>
    <text x="470" y="166" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">latent targets</text>
    <text x="87" y="204" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">context + masked patches</text>
  </g>
</svg>
